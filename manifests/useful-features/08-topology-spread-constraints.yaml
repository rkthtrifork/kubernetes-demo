---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsc-example
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tsc
  template:
    metadata:
      labels:
        app: tsc
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: tsc
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
