---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-probes
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-probes
  template:
    metadata:
      labels:
        app: demo-probes
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
